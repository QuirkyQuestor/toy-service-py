[project]
name = "toy-service-py"
version = "0.1.0"
description = "toy service, FastAPI + PostgreSQL"
readme = "README.md"
authors = [
    { name = "Valery Pazdniakou", email = "valery.pazdniakou@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.1",
]

[project.scripts]
toy-service-py = "toy_service_py.__main__:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
